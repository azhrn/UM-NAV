<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UM-NAV</title><link rel="stylesheet" href="style.css"><script defer src="places.js"></script><script defer src="app.js"></script></head><body><header>UM-NAV</header><main>
<h1>Find your room</h1><label for="search">Room code, name or landmark</label><input type="search" id="search" placeholder="Try DK1 or Makmal Mikro" autocomplete="off"><div id="results"></div>
<section aria-labelledby="floor"><h2 id="floor"></h2><div class="toolbar"><strong id="selected" aria-live="polite">Floor overview</strong><button id="share" hidden>Copy link</button></div><div id="viewport" tabindex="0" aria-label="Floor plan. Scroll to pan."><div id="drawing"><img id="map" alt=""><span id="pin" hidden></span></div></div>
<div class="controls"><button id="out" aria-label="Zoom out">−</button><button id="zoom" aria-label="Zoom in">+</button><button id="fit">Fit floor</button></div>
<small>Approximate layout based on a student map. Follow the posted room signs.</small></section>
<details><summary>Browse places on this floor</summary><div id="directory"></div></details></main></body></html>
